<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QBAD PRO - AI Tracker & HUD</title>
    <!-- โหลด MediaPipe Pose และ TensorFlow / Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0d0f12;
            color: #ffffff;
            overflow: hidden;
            touch-action: manipulation;
        }
        .hud-border {
            border: 2px solid rgba(239, 68, 68, 0.4);
            background: rgba(13, 15, 18, 0.75);
            backdrop-filter: blur(8px);
        }
        .glow-red {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }
    </style>
</head>
<body class="relative w-screen h-screen flex flex-col justify-between p-4 select-none">

    <!-- ส่วนแสดงภาพจากกล้อง (ฉากหลัง) -->
    <div class="absolute inset-0 w-full h-full -z-10 bg-black overflow-hidden">
        <video id="input_video" class="absolute inset-0 w-full h-full object-cover" playsinline></video>
        <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover"></canvas>
    </div>

    <!-- TOP BAR: สถิติด้านบน (Rally Time, Shot Speed และปุ่มสลับกล้อง) -->
    <header class="relative z-10 flex justify-between items-center w-full max-w-5xl mx-auto">
        <div class="hud-border px-4 py-2 rounded-xl flex items-center space-x-3 glow-red">
            <span class="w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
            <div>
                <p class="text-[10px] text-gray-400">RALLY TIME</p>
                <p id="rallyTimer" class="text-lg font-bold tracking-wider text-red-400">00:13.24</p>
            </div>
        </div>

        <!-- ปุ่มสลับกล้อง (หน้า/หลัง) -->
        <button id="switchCameraBtn" class="hud-border px-4 py-2.5 rounded-xl text-xs font-bold text-yellow-400 hover:bg-red-950/50 active:scale-95 transition-all glow-red flex items-center space-x-2 cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <span>SWITCH CAM</span>
        </button>

        <div class="hud-border px-5 py-2 rounded-xl text-center glow-red">
            <p class="text-[10px] text-gray-400">SHOT SPEED</p>
            <p class="text-xl font-black text-yellow-400">245 <span class="text-xs font-normal text-gray-300">km/h</span></p>
        </div>
    </header>

    <!-- CENTER: พื้นที่ว่างสำหรับ AI โฟกัส -->
    <main class="flex-grow flex items-center justify-center relative z-10 pointer-events-none">
    </main>

    <!-- BOTTOM BAR: แถบพลัง Stamina และ มินิมาร์ปสนาม -->
    <footer class="relative z-10 w-full max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        
        <!-- ข้อมูลผู้เล่น / Stamina -->
        <div class="hud-border p-4 rounded-xl space-y-2 glow-red">
            <div class="flex justify-between text-xs">
                <span class="font-bold text-red-400">NAZA (PLAYER 1)</span>
                <span id="staminaText" class="text-gray-300">STAMINA 76%</span>
            </div>
            <!-- หลอดพลัง HP/Stamina -->
            <div class="w-full bg-gray-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-red-500/30">
                <div id="staminaBar" class="bg-gradient-to-r from-red-600 to-yellow-500 h-full rounded-full transition-all duration-300" style="width: 76%;"></div>
            </div>
            <div class="text-[10px] text-gray-400 flex justify-between">
                <span id="moveDist">MOVE: 22.4 m</span>
                <span id="runSpeed">RUN: 8.4 km/h</span>
            </div>
        </div>

        <div class="hidden md:block"></div>

        <!-- มินิมาร์ปสนาม (Court Map) -->
        <div class="hud-border p-2.5 rounded-xl flex flex-col items-center glow-red justify-self-end">
            <p class="text-[10px] text-gray-400 mb-1 font-semibold">COURT MAP</p>
            <div class="relative w-24 h-32 bg-gray-900 border border-red-500/50 rounded flex flex-col justify-between p-1">
                <div class="w-full border-b border-dashed border-red-500/30 h-1/2"></div>
                <!-- จุดแสดงตำแหน่งผู้เล่นบนสนาม -->
                <div id="playerDot" class="absolute bottom-4 left-1/2 -translate-x-1/2 w-2.5 h-2.5 bg-red-500 rounded-full shadow-[0_0_10px_#ef4444] animate-pulse"></div>
            </div>
        </div>

    </footer>

    <!-- จาวาสคริปต์ระบบ AI + การสลับกล้อง -->
    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        let currentFacingMode = 'environment'; // เริ่มต้นที่กล้องหลัง
        let camera = null;

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // วาดภาพจากกล้องลงแคนวาส
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // ถ้าร่างกายมนุษย์ถูกตรวจจับโดย AI
            if (results.poseLandmarks) {
                // วาดโครงกระดูกสไตล์เกมเรืองแสงสีแดง-ส้ม
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#ef4444', lineWidth: 3});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#f59e0b', lineWidth: 1, radius: 3});
            }
            canvasCtx.restore();
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        // ฟังก์ชันเริ่มและสลับกล้อง
        function startCamera() {
            if (camera) {
                camera.stop();
            }

            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await pose.send({image: videoElement});
                },
                facingMode: currentFacingMode,
                width: 720,
                height: 1280
            });

            camera.start().catch(err => {
                console.error("Camera Error:", err);
                alert("ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบสิทธิ์การเข้าถึงกล้อง");
            });
        }

        // ปุ่มกดสลับกล้อง หน้า/หลัง
        document.getElementById('switchCameraBtn').addEventListener('click', () => {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        });

        // เริ่มต้นทำงานกล้องครั้งแรก
        startCamera();
    </script>
</body>
</html>
